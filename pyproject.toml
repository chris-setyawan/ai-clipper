[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-clipper"
version = "0.1.0"
description = "Turns a long podcast into short-form clips: explainable hook scoring, face-tracked framing, burned-in captions, per-platform export"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Christopher" }]
keywords = ["video", "podcast", "shorts", "subtitles", "whisper", "nlp"]

# Kept in step with requirements.txt, which stays for people who would rather
# pip install -r than install the package.
dependencies = [
    "opencv-python-headless>=4.8,<5",
    "numpy>=1.24",
    "faster-whisper>=1.0",
    "av>=11",
    "yt-dlp>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
ai-clipper = "ai_clipper.cli.pipeline:main"
ai-clipper-transcribe = "ai_clipper.cli.transcribe:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The fonts have to travel with the wheel. An installed copy has no repo root to
# find them in, and without them libass silently falls back to whatever face it
# can find, which is the kind of failure nobody notices until the clip is posted.
ai_clipper = ["assets/fonts/*.ttf", "assets/fonts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
